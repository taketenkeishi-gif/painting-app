<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Vivid purple-to-deep-blue background (CSP-like) -->
    <linearGradient id="bg" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#7b2fff"/>
      <stop offset="50%"  stop-color="#4a1fd6"/>
      <stop offset="100%" stop-color="#1a0a8c"/>
    </linearGradient>

    <!-- Subtle inner highlight on bg (top-left lighter) -->
    <radialGradient id="bgHl" cx="30%" cy="25%" r="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Nib: bright white-to-silver -->
    <linearGradient id="nibL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#dde4ff"/>
      <stop offset="100%" stop-color="#b0bcee"/>
    </linearGradient>
    <linearGradient id="nibR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#aab2e0"/>
      <stop offset="100%" stop-color="#8890cc"/>
    </linearGradient>

    <!-- Ink drop at tip -->
    <radialGradient id="ink" cx="45%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="40%"  stop-color="#a8d4ff"/>
      <stop offset="100%" stop-color="#4488ee" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Nib shadow -->
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feOffset dx="0" dy="6" result="o"/>
      <feFlood flood-color="#00005a" flood-opacity="0.45" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="256" height="256" rx="52" ry="52"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="256" height="256" fill="url(#bg)"/>
    <rect width="256" height="256" fill="url(#bgHl)"/>

    <!-- G-pen nib: large, centered, high contrast white -->
    <!-- Positioned: shoulders at y=44, tip at y=210, centered at x=128 -->
    <g filter="url(#shadow)">

      <!-- Right half (shadow side) -->
      <path d="
        M 128 210
        C 142 188, 176 154, 178 110
        C 179  82, 162  52, 128  44
        Z
      " fill="url(#nibR)"/>

      <!-- Left half (bright side) -->
      <path d="
        M 128 210
        C 114 188,  80 154,  78 110
        C  77  82,  94  52, 128  44
        Z
      " fill="url(#nibL)"/>

      <!-- Shoulder arc highlight (top rim) -->
      <path d="M 94 62 C 104 50, 118 44, 128 44 C 138 44, 152 50, 162 62"
            fill="none" stroke="#ffffff" stroke-width="3.5"
            stroke-linecap="round" opacity="0.85"/>

      <!-- Left specular stripe -->
      <path d="M 85 90 C 80 110, 80 132, 86 154 C 90 168, 100 186, 112 200"
            fill="none" stroke="#ffffff" stroke-width="3"
            stroke-linecap="round" opacity="0.30"/>

      <!-- Vent hole -->
      <ellipse cx="128" cy="98" rx="6" ry="12"
               fill="#2a0a80" opacity="0.70"/>
      <!-- Vent hole inner -->
      <ellipse cx="128" cy="98" rx="4" ry="9"
               fill="#1a0660" opacity="0.50"/>
      <!-- Vent hole highlight -->
      <path d="M 123.5 88 C 122 93, 122 103, 123.5 108"
            fill="none" stroke="#ffffff" stroke-width="1.2"
            stroke-linecap="round" opacity="0.40"/>

      <!-- Center slit -->
      <line x1="128" y1="54" x2="128" y2="196"
            stroke="#2a0a80" stroke-width="2.5"
            stroke-linecap="round" opacity="0.65"/>
      <!-- Slit edge highlight -->
      <line x1="130" y1="56" x2="130" y2="192"
            stroke="#ffffff" stroke-width="1"
            stroke-linecap="round" opacity="0.30"/>

      <!-- Split tines -->
      <path d="M 128 196 C 122 202, 118 207, 117 214"
            fill="none" stroke="#c0caee" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 128 196 C 134 202, 138 207, 139 214"
            fill="none" stroke="#c0caee" stroke-width="2.5" stroke-linecap="round"/>

    </g>

    <!-- Ink bead at tip -->
    <circle cx="128" cy="197" r="8"   fill="url(#ink)" opacity="0.95"/>
    <circle cx="128" cy="197" r="3.5" fill="#ffffff"   opacity="0.90"/>
    <circle cx="125.5" cy="194.5" r="1.5" fill="#ffffff" opacity="0.70"/>

    <!-- Border rim -->
    <rect x="1" y="1" width="254" height="254" rx="51" ry="51"
          fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.20"/>
  </g>
</svg>
