<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d0d4e0"/>
      <stop offset="1" stop-color="#2a2e3e"/>
    </linearGradient>
  </defs>
  <!-- Gradient preview rectangle -->
  <rect x="2" y="5" width="20" height="12" rx="1.5" fill="url(#g)"/>
  <!-- Rectangle border -->
  <rect x="2" y="5" width="20" height="12" rx="1.5" fill="none" stroke="#888ca0" stroke-width="0.75"/>
  <!-- Direction arrow: shaft -->
  <line x1="5" y1="11" x2="17" y2="11" stroke="#1c2030" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polygon points="19,11 15.5,9 15.5,13" fill="#1c2030"/>
</svg>
