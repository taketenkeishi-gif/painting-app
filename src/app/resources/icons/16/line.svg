<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Diagonal line (thick) -->
  <line x1="4" y1="20" x2="20" y2="4"
        stroke="#b0b5c8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Endpoint circles (anchor indicators) -->
  <circle cx="4" cy="20" r="2.5" fill="#b0b5c8"/>
  <circle cx="20" cy="4" r="2.5" fill="#b0b5c8"/>
  <!-- Inner highlight on endpoints -->
  <circle cx="4" cy="20" r="1" fill="#d0d4e0"/>
  <circle cx="20" cy="4" r="1" fill="#d0d4e0"/>
</svg>
