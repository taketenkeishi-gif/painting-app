<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Magnifier lens (thick ring) -->
  <circle cx="10" cy="10" r="6.5" stroke="#b0b5c8" stroke-width="2.5"/>
  <!-- Handle -->
  <line x1="15" y1="15" x2="21.5" y2="21.5"
        stroke="#b0b5c8" stroke-width="3" stroke-linecap="round"/>
  <!-- Plus sign inside lens (zoom-in indicator) -->
  <line x1="10" y1="6.5" x2="10" y2="13.5"
        stroke="#9095ab" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6.5" y1="10" x2="13.5" y2="10"
        stroke="#9095ab" stroke-width="1.5" stroke-linecap="round"/>
</svg>
