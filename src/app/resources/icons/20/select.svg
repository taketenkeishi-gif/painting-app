<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Selection rectangle with dashes -->
  <rect x="3" y="3" width="18" height="18" rx="1"
        stroke="#b0b5c8" stroke-width="1.5" stroke-dasharray="3 2.5"/>
  <!-- Corner handles (solid squares for clarity) -->
  <rect x="1.5" y="1.5" width="3" height="3" rx="0.5" fill="#b0b5c8"/>
  <rect x="19.5" y="1.5" width="3" height="3" rx="0.5" fill="#b0b5c8"/>
  <rect x="1.5" y="19.5" width="3" height="3" rx="0.5" fill="#b0b5c8"/>
  <rect x="19.5" y="19.5" width="3" height="3" rx="0.5" fill="#b0b5c8"/>
  <!-- Mid-edge handles -->
  <rect x="10.5" y="1.5" width="3" height="3" rx="0.5" fill="#9095ab"/>
  <rect x="10.5" y="19.5" width="3" height="3" rx="0.5" fill="#9095ab"/>
  <rect x="1.5" y="10.5" width="3" height="3" rx="0.5" fill="#9095ab"/>
  <rect x="19.5" y="10.5" width="3" height="3" rx="0.5" fill="#9095ab"/>
</svg>
